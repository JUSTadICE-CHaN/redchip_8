
name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: exe

          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            extension: ""

          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            extension: ""

          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            extension: ""

    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libasound2-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build release executable
        run: >
          cargo build
          --release
          --manifest-path rchip_frontend/Cargo.toml
          --package rchip_frontend
          --target ${{ matrix.target }}

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/rchip
          Copy-Item "target/${{ matrix.target }}/release/rchip_frontend.exe" dist/rchip/
          Copy-Item rchip_frontend/assets -Destination dist/rchip -Recurse
          Copy-Item rchip_frontend/roms -Destination dist/rchip -Recurse
          Compress-Archive -Path dist/rchip/* -DestinationPath "rchip-${{ matrix.name }}.zip"

      - name: Package Unix executable
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/rchip
          cp "target/${{ matrix.target }}/release/rchip_frontend" dist/rchip/
          cp -R rchip_frontend/assets dist/rchip/
          cp -R rchip_frontend/roms dist/rchip/
          cd dist
          zip -r "../rchip-${{ matrix.name }}.zip" rchip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rchip-${{ matrix.name }}
          path: rchip-${{ matrix.name }}.zip

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*.zip

